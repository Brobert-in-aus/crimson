name: Quest personal build

on:
  workflow_dispatch:
    inputs:
      publish_artifact:
        description: Upload this fork owner's asset-free APK and signing key
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  QUEST_CACHE: ${{ github.workspace }}/.quest-ci-cache

jobs:
  quest:
    name: Build asset-free Quest APK
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Assert asset-free checkout
        shell: pwsh
        run: ./crimson-vr/tools/assert_quest_asset_free.ps1

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Cache pinned Quest downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.QUEST_CACHE }}
          key: quest-tools-godot-4.7-vendors-5.1.0

      - name: Restore repeat-update signing key
        shell: pwsh
        env:
          QUEST_KEYSTORE_BASE64: ${{ secrets.QUEST_KEYSTORE_BASE64 }}
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'artifacts/crimsonvr-ci.keystore'
          New-Item -ItemType Directory -Force (Split-Path $path) | Out-Null
          if ([string]::IsNullOrWhiteSpace($env:QUEST_KEYSTORE_BASE64)) {
            Add-Content $env:GITHUB_ENV 'QUEST_SIGNING_KEY_SOURCE=generated_for_this_run'
            Write-Host 'No saved signing key configured; this run will generate one.'
            exit 0
          }
          try {
            $encoded = $env:QUEST_KEYSTORE_BASE64 -replace '\s', ''
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($encoded))
          }
          catch {
            throw 'QUEST_KEYSTORE_BASE64 is not a valid base64-encoded keystore.'
          }
          Add-Content $env:GITHUB_ENV 'QUEST_SIGNING_KEY_SOURCE=repository_secret'
          Write-Host 'Restored the saved signing key for in-place APK updates.'

      - name: Restore Quest toolchain
        id: quest-tools
        shell: pwsh
        run: ./crimson-vr/tools/bootstrap_quest_ci.ps1 -CacheDir $env:QUEST_CACHE

      - name: Test VR frontend
        shell: pwsh
        run: dotnet test crimson-vr/tests/CrimsonVR.Tests/CrimsonVR.Tests.csproj

      - name: Build native Quest library
        shell: pwsh
        run: ./crimson-vr/tools/build_libcrimson.ps1 -android

      - name: Export signed Quest APK
        shell: pwsh
        run: |
          ./crimson-vr/tools/build_quest.ps1 `
            -AssetMode AssetFree `
            -Release `
            -InstallAndroidBuildTemplate `
            -Godot '${{ steps.quest-tools.outputs.godot }}' `
            -AndroidSdk '${{ steps.quest-tools.outputs.android_sdk }}' `
            -Jdk '${{ steps.quest-tools.outputs.jdk }}' `
            -Keystore '${{ steps.quest-tools.outputs.keystore }}'

      - name: Write personal-build manifest
        shell: pwsh
        run: |
          $apk = Resolve-Path artifacts/CrimsonVR.quest.apk
          @(
            'CrimsonVR personal Quest build'
            "repository=${{ github.repository }}"
            "commit=${{ github.sha }}"
            "run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            "apk_sha256=$((Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant())"
            "signing_key_source=$env:QUEST_SIGNING_KEY_SOURCE"
            'keystore_alias=androiddebugkey'
            'keystore_password=android'
            'Keep the keystore: Android requires the same key for in-place updates.'
          ) | Set-Content artifacts/QUEST-PERSONAL-BUILD.txt

      - name: Upload personal-build bundle
        if: ${{ inputs.publish_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: CrimsonVR-Quest-${{ github.run_number }}
          path: |
            artifacts/CrimsonVR.quest.apk
            artifacts/crimsonvr-ci.keystore
            artifacts/QUEST-PERSONAL-BUILD.txt
          if-no-files-found: error
          retention-days: 1

      - name: Personal-build summary
        if: ${{ inputs.publish_artifact }}
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY @'
          This fork owner's asset-free playtest bundle is available for one day. Download all
          three files. Before the next build, save the keystore as the fork's
          repository secret `QUEST_KEYSTORE_BASE64` to permit in-place updates.
          Each tester must supply Crimsonland Classic assets locally; never
          upload an asset pack to GitHub.
          '@

      - name: Public validation summary
        if: ${{ !inputs.publish_artifact }}
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY @'
          The asset-free Quest APK built and verified successfully. No binary
          artifact was requested. Run this workflow in your own fork with
          `publish_artifact=true` to receive your personal-build bundle.
          '@
